<script>

/* =========================================================
   UPDATED ATTENDANCE + RESULT MODULE
   बाकी SchoolHub code को न बदलें
   ========================================================= */

/* ---------- COMMON ---------- */

function today(){
    return new Date().toISOString().split("T")[0];
}

function getStudents(){
    let data=localStorage.getItem("schoolStudents");
    if(!data)return [];
    try{return JSON.parse(data)}catch(e){return []}
}

function saveStudents(data){
    localStorage.setItem("schoolStudents",JSON.stringify(data));
}

function getAttendance(){
    let data=localStorage.getItem("schoolAttendance");
    if(!data)return [];
    try{return JSON.parse(data)}catch(e){return []}
}

function saveAttendance(data){
    localStorage.setItem("schoolAttendance",JSON.stringify(data));
}

function getExams(){
    let data=localStorage.getItem("schoolExams");
    if(!data)return [];
    try{return JSON.parse(data)}catch(e){return []}
}

function saveExams(data){
    localStorage.setItem("schoolExams",JSON.stringify(data));
}

function getClassStudents(classNo){
    return getStudents().filter(
        s=>Number(s.classNo)===Number(classNo)
    );
}

function getSectionStudents(classNo,section,stream=""){
    return getStudents().filter(s=>
        Number(s.classNo)===Number(classNo) &&
        s.section===section &&
        (!stream || s.stream===stream)
    );
}

function formatDate(date){
    if(!date)return "-";
    let p=date.split("-");
    if(p.length!==3)return date;
    return p[2]+"-"+p[1]+"-"+p[0];
}

function escapeHtml(text){
    return String(text??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================================================
   ATTENDANCE
   ========================================================= */

let attendanceClassNo=null;
let attendanceSection="";
let attendanceStream="";
let attendanceDate=today();


/* CLASS → SECTION */

function openAttendanceClasses(){

    let html=`
    <button class="back-btn" onclick="showPage('dashboard')">
        ← Back
    </button>

    <div class="card">
        <div class="card-header">
            <h3>📅 Attendance - Select Class</h3>
        </div>
    </div>

    <div class="stats">
    `;

    for(let i=1;i<=12;i++){

        let students=getClassStudents(i);

        <div class="class-card"
             onclick="openAttendanceSections(${i})">

            <div class="class-number">
                Class ${i}
            </div>

/* SECTION */

function openAttendanceSections(classNo){

    let html=`
    <button class="back-btn"

        <div class="card-header">
            <h3>Class ${classNo} - Select Section</h3>

                    Select Section →

            `;

    }else{

        sections.forEach(section=>{

            let count=students.filter(
                s=>s.section===section

                 onclick="openAttendanceStudents(${classNo},'${section}','')">

                <div class="class-number">
                    Section ${section}
                </div>

                <div class="class-info">

/* STREAM → SECTION */

function openAttendanceStreamSections(classNo,stream){

    attendanceStream=stream;

    let html=`

            onclick="openAttendanceSections(${classNo})">

    <div class="card">
        <div class="card-header">
            <h3>
                Class ${classNo} - ${stream} - Select Section

    </div>

    ["A","B","C"].forEach(section=>{

            classNo,

/* STUDENTS */

function openAttendanceStudents(
    classNo,
    section,
    stream=""
){

    attendanceClassNo=classNo;
    attendanceSection=section;
    attendanceStream=stream;
    attendanceDate=today();

    let students=getSectionStudents(
        classNo,
        section,
        stream
    );

    let title=`Class ${classNo}`;

    if(stream)title+=` - ${stream}`;

    title+=` - Section ${section}`;

    let html=`
    <button class="back-btn"
        onclick="${
            stream
            ?`openAttendanceStreamSections(${classNo},'${stream}')`
            :`openAttendanceSections(${classNo})`
        }">
        ← Back
    </button>

    <div class="card">

        <div class="card-header">

            <div>
                <h3>📅 ${title}</h3>

                <p style="color:#777;font-size:12px;margin-top:5px">
                    ${students.length} Students
                </p>
            </div>

        </div>

        <div style="
            padding:18px;
            background:#f8faff;
            display:flex;
            gap:12px;
            flex-wrap:wrap;
            align-items:center;
        ">

            <div>
                <label style="font-weight:bold">
                    Date
                </label>

                <input
                    type="date"
                    id="attendanceDateInput"
                    value="${today()}"
                    onchange="changeAttendanceDate(this.value)"
                    style="width:180px"
                >
            </div>

            <button
                class="small-btn"
                onclick="markAllPresent()">
                🟢 Mark All Present
            </button>

            <button
                class="small-btn"
                style="background:#15803d"
                onclick="saveAttendanceForClass()">
                💾 Save Attendance
            </button>

            <button
                class="edit-btn"
                onclick="openAttendanceHistory()">
                📜 History
            </button>

        </div>

        <div id="attendanceStudentList">
    `;

    if(students.length===0){

        html+=`
        <div class="empty">
            <h3>No Students Found</h3>
            <p>Add students to this section first.</p>
        </div>
        `;

    }else{

        students.forEach((s,index)=>{

            let existing=getAttendance().find(x=>
                Number(x.studentId)===Number(s.id) &&
                x.date===attendanceDate
            );

            let status=existing
                ?existing.status
                :"";

            html+=`
            <div
                id="attRow_${s.id}"
                style="
                    padding:15px 20px;
                    border-bottom:1px solid #edf0f4;
                    display:flex;
                    justify-content:space-between;
                    align-items:center;
                    gap:15px;
                    flex-wrap:wrap;
                ">

                <div style="min-width:220px">

                    <strong>
                        ${index+1}. ${escapeHtml(s.name)}
                    </strong>

                    <div style="
                        color:#777;
                        font-size:12px;
                        margin-top:4px;
                    ">
                        Father: ${escapeHtml(s.father)}
                        | Section: ${s.section}
                    </div>

                </div>

                <div class="action-buttons">

                    <button
                        id="present_${s.id}"
                        class="${
                            status==="Present"
                            ?"small-btn"
                            :"edit-btn"
                        }"
                        onclick="setAttendanceStatus(${s.id},'Present')">

                        🟢 Present
                    </button>

                    <button
                        id="absent_${s.id}"
                        class="${
                            status==="Absent"
                            ?"delete-btn"
                            :"edit-btn"
                        }"
                        onclick="setAttendanceStatus(${s.id},'Absent')">

                        🔴 Absent
                    </button>

                    <button
                        id="leave_${s.id}"
                        class="${
                            status==="Leave"
                            ?"small-btn"
                            :"edit-btn"
                        }"
                        onclick="setAttendanceStatus(${s.id},'Leave')">

                        🟡 Leave
                    </button>

                </div>

            </div>
            `;
        });
    }

    html+=`
        </div>
    </div>
    `;

    document.getElementById("otherPage").innerHTML=html;
}


/* CHANGE DATE */

function changeAttendanceDate(date){

    attendanceDate=date;

    openAttendanceStudents(
        attendanceClassNo,
        attendanceSection,
        attendanceStream
    );
}


/* TEMP STATUS */

let temporaryAttendance={};


function setAttendanceStatus(studentId,status){

    temporaryAttendance[studentId]=status;

    updateAttendanceButtonUI(
        studentId,
        status
    );
}


function updateAttendanceButtonUI(studentId,status){

    let p=document.getElementById("present_"+studentId);
    let a=document.getElementById("absent_"+studentId);
    let l=document.getElementById("leave_"+studentId);

    if(!p||!a||!l)return;

    p.className=status==="Present"
        ?"small-btn"
        :"edit-btn";

    a.className=status==="Absent"
        ?"delete-btn"
        :"edit-btn";

    l.className=status==="Leave"
        ?"small-btn"
        :"edit-btn";
}


/* MARK ALL */

function markAllPresent(){

    let students=getSectionStudents(
        attendanceClassNo,
        attendanceSection,
        attendanceStream
    );

    students.forEach(s=>{

        temporaryAttendance[s.id]="Present";

        updateAttendanceButtonUI(
            s.id,
            "Present"
        );

    });
}


/* SAVE */

function saveAttendanceForClass(){

    let students=getSectionStudents(
        attendanceClassNo,
        attendanceSection,
        attendanceStream
    );

    if(students.length===0){
        alert("No students found.");
        return;
    }

    let records=getAttendance();

    students.forEach(s=>{

        let status=
            temporaryAttendance[s.id];

        if(!status){

            let old=records.find(x=>
                Number(x.studentId)===Number(s.id) &&
                x.date===attendanceDate
            );

            status=old?old.status:"Present";
        }

        let index=records.findIndex(x=>
            Number(x.studentId)===Number(s.id) &&
            x.date===attendanceDate
        );

        let record={
            id:index>=0
                ?records[index].id
                :Date.now()+Math.floor(Math.random()*100000),

            studentId:s.id,
            date:attendanceDate,
            status:status,
            classNo:Number(s.classNo),
            section:s.section,
            stream:s.stream||""
        };

        if(index>=0){
            records[index]=record;
        }else{
            records.push(record);
        }

    });

    saveAttendance(records);

    temporaryAttendance={};

    alert("Attendance saved successfully! ✅");

    openAttendanceStudents(
        attendanceClassNo,
        attendanceSection,
        attendanceStream
    );

    updateDashboard();
}


/* HISTORY */

function openAttendanceHistory(){

    let students=getSectionStudents(
        attendanceClassNo,
        attendanceSection,
        attendanceStream
    );

    let records=getAttendance();

    let html=`
    <button class="back-btn"
        onclick="openAttendanceStudents(
            ${attendanceClassNo},
            '${attendanceSection}',
            '${attendanceStream}'
        )">
        ← Back
    </button>

    <div class="card">

        <div class="card-header">
            <h3>📜 Attendance History</h3>
        </div>

        <div class="table-container">

        <table>

            <thead>
                <tr>
                    <th>Date</th>
                    <th>Student</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
    `;

    let filtered=records.filter(r=>
        students.some(s=>
            Number(s.id)===Number(r.studentId)
        )
    );

    filtered.sort((a,b)=>
        String(b.date).localeCompare(String(a.date))
    );

    if(filtered.length===0){

        html+=`
        <tr>
            <td colspan="4">
                <div class="empty">
                    No attendance history
                </div>
            </td>
        </tr>
        `;

    }else{

        filtered.forEach(r=>{

            let s=students.find(
                x=>Number(x.id)===Number(r.studentId)
            );

            let badge=
                r.status==="Present"
                ?"green"
                :r.status==="Absent"
                ?"red"
                :"yellow";

            html+=`
            <tr>

                <td>${formatDate(r.date)}</td>

                <td>
                    <strong>
                        ${escapeHtml(s?s.name:"Unknown")}
                    </strong>
                </td>

                <td>
                    <span class="badge ${badge}">
                        ${r.status}
                    </span>
                </td>

                <td>

                    <div class="action-buttons">

                        <button
                            class="edit-btn"
                            onclick="editAttendanceRecord(${r.id})">
                            ✏️ Edit
                        </button>

                        <button
                            class="delete-btn"
                            onclick="deleteAttendanceRecord(${r.id})">
                            🗑️ Delete
                        </button>

                    </div>

                </td>

            </tr>
            `;
        });
    }

    html+=`
            </tbody>
        </table>

        </div>
    </div>

    <div class="card">

        <div class="card-header">
            <h3>📊 Monthly Attendance %</h3>
        </div>

        <div class="table-container">

        <table>

            <thead>
                <tr>
                    <th>Student</th>
                    <th>Present</th>
                    <th>Absent</th>
                    <th>Leave</th>
                    <th>Total</th>
                    <th>Attendance %</th>
                </tr>
            </thead>

            <tbody>
    `;

    students.forEach(s=>{

        let rs=records.filter(r=>
            Number(r.studentId)===Number(s.id)
        );

        let present=rs.filter(
            r=>r.status==="Present"
        ).length;

        let absent=rs.filter(
            r=>r.status==="Absent"
        ).length;

        let leave=rs.filter(
            r=>r.status==="Leave"
        ).length;

        let total=present+absent+leave;

        let percent=total
            ?((present/total)*100).toFixed(1)
            :0;

        html+=`
        <tr>

            <td>
                <strong>${escapeHtml(s.name)}</strong>
            </td>

            <td class="summary-green">
                ${present}
            </td>

            <td class="summary-red">
                ${absent}
            </td>

            <td class="summary-yellow">
                ${leave}
            </td>

            <td>${total}</td>

            <td>
                <strong>${percent}%</strong>
            </td>

        </tr>
        `;
    });

    html+=`
            </tbody>
        </table>

        </div>
    </div>
    `;

    document.getElementById("otherPage").innerHTML=html;
}


/* EDIT ATTENDANCE */

function editAttendanceRecord(id){

    let record=getAttendance().find(
        x=>Number(x.id)===Number(id)
    );

    if(!record)return;

    let newStatus=prompt(
        "Enter status:\nPresent / Absent / Leave",
        record.status
    );

    if(!newStatus)return;

    newStatus=
        newStatus.trim().toLowerCase();

    if(newStatus==="present")newStatus="Present";
    else if(newStatus==="absent")newStatus="Absent";
    else if(newStatus==="leave")newStatus="Leave";
    else{
        alert("Invalid status");
        return;
    }

    record.status=newStatus;

    saveAttendance(getAttendance());

    openAttendanceHistory();
}


/* DELETE ATTENDANCE */

function deleteAttendanceRecord(id){

    if(!confirm(
        "Delete this attendance record?"
    ))return;

    saveAttendance(
        getAttendance().filter(
            x=>Number(x.id)!==Number(id)
        )
    );

    openAttendanceHistory();
}

){

    resultClassNo=classNo;
    resultSection=section;
    resultStream=stream;

    let students=getSectionStudents(
        classNo,
        section,
        stream
    );

    let title=`Class ${classNo}`;

    if(stream)title+=` - ${stream}`;

    title+=` - Section ${section}`;

    let html=`
    <button class="back-btn"
        onclick="${
            stream
            ?`openResultStreamSections(${classNo},'${stream}')`
            :`openResultSections(${classNo})`
        }">
        ← Back
    </button>

    <div class="card">

        <div class="card-header">

            <div>
                <h3>📝 ${title}</h3>
                <p style="color:#777;font-size:12px">
                    Select student
                </p>
            </div>

        </div>

        <div class="table-container">

        <table>

            <thead>
                <tr>
                    <th>Roll</th>
                    <th>Student</th>
                    <th>Father</th>
                    <th>Results</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
    `;

    if(students.length===0){

        html+=`
        <tr>
            <td colspan="5">
                <div class="empty">
                    No Students Found
                </div>
            </td>
        </tr>
        `;

    }else{

        students.forEach((s,index)=>{

            let results=getStudentResults(s.id);

            html+=`
            <tr>

                <td>${index+1}</td>

                <td>
                    <strong>
                        ${escapeHtml(s.name)}
                    </strong>
                </td>

                <td>
                    ${escapeHtml(s.father)}
                </td>

                <td>
                    ${results.length}
                    Result${results.length!==1?"s":""}
                </td>

                <td>

                    <div class="action-buttons">

                        <button
                            class="small-btn"
                            onclick="openAddResult(
                                ${s.id},
                                ${classNo},
                                '${section}',
                                '${stream}'
                            )">
                            + Add Result
                        </button>

                        <button
                            class="edit-btn"
                            onclick="openStudentResultHistory(
                                ${s.id},
                                ${classNo},
                                '${section}',
                                '${stream}'
                            )">
                            📜 Full History
                        </button>

                    </div>

                </td>

            </tr>
            `;
        });
    }

    html+=`
            </tbody>
        </table>

        </div>
    </div>
    `;

    document.getElementById("otherPage").innerHTML=html;
}


/* RESULTS DATA */

function getStudentResults(studentId){

    return getExams()
        .filter(x=>
            Number(x.studentId)===Number(studentId)
        )
        .sort((a,b)=>
            String(b.examDate)
            .localeCompare(String(a.examDate))
        );
}


/* ADD RESULT */

function openAddResult(
    studentId,
    classNo,
    section,
    stream=""
){

    let s=getStudents().find(
        x=>Number(x.id)===Number(studentId)
    );

    if(!s)return;

    resultSubjects=[];

    window.resultStudentId=studentId;
    window.resultEditingId=null;
    window.resultClassNo=classNo;
    window.resultSection=section;
    window.resultStream=stream;

    showResultEditor(
        s,
        "Add Result"
    );
}


/* EDIT RESULT */

function editResult(
    resultId,
    studentId,
    classNo,
    section,
    stream=""
){

    let s=getStudents().find(
        x=>Number(x.id)===Number(studentId)
    );

    let result=getExams().find(
        x=>Number(x.id)===Number(resultId)
    );

    if(!s||!result)return;

    window.resultStudentId=studentId;
    window.resultEditingId=resultId;
    window.resultClassNo=classNo;
    window.resultSection=section;
    window.resultStream=stream;

    resultSubjects=
        Array.isArray(result.subjects)
        ?JSON.parse(JSON.stringify(result.subjects))
        :[];

    showResultEditor(
        s,
        "Edit Result"
    );
}


/* RESULT EDITOR */

function showResultEditor(student,title){

    let existing=null;

    if(window.resultEditingId){

        existing=getExams().find(
            x=>Number(x.id)===Number(window.resultEditingId)
        );
    }

    let html=`
    <div class="modal-bg"
         id="resultEditor"
         style="display:flex">

        <div class="modal">

            <div class="modal-header">

                <div>
                    <h2>${title}</h2>

                    <p style="
                        color:#777;
                        font-size:13px;
                        margin-top:4px
                    ">
                        ${escapeHtml(student.name)}
                    </p>
                </div>

                <button
                    class="close-btn"
                    onclick="closeResultEditor()">
                    ×
                </button>

            </div>

            <div class="form-grid">

                <div class="form-group">
                    <label>Exam Name *</label>
                    <input
                        id="newResultExamName"
                        value="${
                            existing
                            ?escapeHtml(existing.examName)
                            :"Annual Examination"
                        }">
                </div>

                <div class="form-group">
                    <label>Exam Date *</label>
                    <input
                        id="newResultExamDate"
                        type="date"
                        value="${
                            existing
                            ?existing.examDate
                            :today()
                        }">
                </div>

            </div>

            <div class="card"
                 style="margin-top:15px">

                <div class="card-header">

                    <h3>Subjects</h3>

                    <button
                        class="small-btn"
                        onclick="addResultSubject()">
                        + Add Subject
                    </button>

                </div>

                <div id="resultSubjectsArea">
                </div>

            </div>

            <div id="resultCalculation"
                 style="
                    margin-top:15px;
                    background:#f8faff;
                    padding:15px;
                    border-radius:12px;
                 ">
            </div>

            <button
                class="btn btn-primary"
                style="margin-top:18px"
                onclick="saveNewResult()">
                💾 Save Result
            </button>

        </div>
    </div>
    `;

    document.body.insertAdjacentHTML(
        "beforeend",
        html
    );

    renderResultSubjects();

    if(resultSubjects.length===0){
        addResultSubject();
    }
}


/* ADD SUBJECT */

function addResultSubject(){

    resultSubjects.push({
        id:Date.now()+Math.random(),
        name:"",
        max:100,
        obtained:0
    });

    renderResultSubjects();
}


/* RENDER SUBJECTS */

function renderResultSubjects(){

    let area=document.getElementById(
        "resultSubjectsArea"
    );

    if(!area)return;

    if(resultSubjects.length===0){

        area.innerHTML=`
        <div class="empty">
            Click "+ Add Subject"
        </div>
        `;

        calculateResult();

        return;
    }

    let html="";

    resultSubjects.forEach((sub,index)=>{

        html+=`
        <div style="
            padding:15px;
            border-bottom:1px solid #edf0f4;
        ">

            <div style="
                display:flex;
                justify-content:space-between;
                align-items:center;
                margin-bottom:10px;
            ">

                <strong>
                    Subject ${index+1}
                </strong>

                <button
                    class="delete-btn"
                    onclick="removeResultSubject(${index})">
                    🗑️ Remove
                </button>

            </div>

            <div class="form-grid">

                <div class="form-group">

                    <label>Subject Name</label>

                    <input
                        value="${escapeHtml(sub.name)}"
                        placeholder="e.g. Mathematics"
                        oninput="updateResultSubject(
                            ${index},
                            'name',
                            this.value
                        )">

                </div>

                <div class="form-group">

                    <label>Maximum Marks</label>

                    <input
                        type="number"
                        min="1"
                        value="${sub.max}"
                        oninput="updateResultSubject(
                            ${index},
                            'max',
                            this.value
                        )">

                </div>

                <div class="form-group">

                    <label>Obtained Marks</label>

                    <input
                        type="number"
                        min="0"
                        value="${sub.obtained}"
                        oninput="updateResultSubject(
                            ${index},
                            'obtained',
                            this.value
                        )">

                </div>

            </div>

        </div>
        `;
    });

    area.innerHTML=html;

    calculateResult();
}


/* UPDATE SUBJECT */

function updateResultSubject(
    index,
    field,
    value
){

    if(!resultSubjects[index])return;

    if(field==="name"){
        resultSubjects[index].name=value;
    }else{
        resultSubjects[index][field]=
            Number(value)||0;
    }

    calculateResult();
}


/* REMOVE */

function removeResultSubject(index){

    resultSubjects.splice(index,1);

    renderResultSubjects();
}


/* CALCULATE */

function calculateResult(){

    let total=0;
    let obtained=0;

    resultSubjects.forEach(s=>{

        total+=Number(s.max)||0;
        obtained+=Number(s.obtained)||0;

    });

    let percentage=
        total
        ?(obtained/total*100)
        :0;

    let pass=
        resultSubjects.length>0 &&
        resultSubjects.every(s=>
            Number(s.max)>0 &&
            Number(s.obtained)<=Number(s.max) &&
            (Number(s.obtained)/Number(s.max)*100)>=33
        );

    let box=document.getElementById(
        "resultCalculation"
    );

    if(!box)return;

    box.innerHTML=`

        <div style="
            display:flex;
            gap:20px;
            flex-wrap:wrap;
        ">

            <div>
                📚 Subjects:
                <strong>
                    ${resultSubjects.length}
                </strong>
            </div>

            <div>
                Total Marks:
                <strong>
                    ${total}
                </strong>
            </div>

            <div>
                Obtained:
                <strong>
                    ${obtained}
                </strong>
            </div>

            <div>
                Percentage:
                <strong>
                    ${percentage.toFixed(2)}%
                </strong>
            </div>

            <div>
                Result:

                <span class="badge ${
                    pass?"green":"red"
                }">
                    ${pass?"PASS":"FAIL"}
                </span>

            </div>

        </div>
    `;
}


/* SAVE RESULT */

function saveNewResult(){

    let examName=document
        .getElementById("newResultExamName")
        .value.trim();

    let examDate=document
        .getElementById("newResultExamDate")
        .value;

    if(!examName){
        alert("Enter Exam Name");
        return;
    }

    if(!examDate){
        alert("Select Exam Date");
        return;
    }

    if(resultSubjects.length===0){
        alert("Add at least one subject");
        return;
    }

    for(let s of resultSubjects){

        if(!s.name.trim()){

            alert("Enter Subject Name");
            return;
        }

        if(Number(s.max)<=0){

            alert(
                "Maximum Marks must be greater than 0"
            );

            return;
        }

        if(
            Number(s.obtained)<0 ||
            Number(s.obtained)>Number(s.max)
        ){

            alert(
                "Obtained Marks cannot be greater than Maximum Marks"
            );

            return;
        }
    }

    let data=getExams();

    let total=resultSubjects.reduce(
        (a,s)=>a+Number(s.max),0
    );

    let obtained=resultSubjects.reduce(
        (a,s)=>a+Number(s.obtained),0
    );

    let percentage=
        total
        ?obtained/total*100
        :0;

    let pass=resultSubjects.every(s=>
        Number(s.obtained)/Number(s.max)*100>=33
    );

    let record={

        id:window.resultEditingId
            ?window.resultEditingId
            :Date.now(),

        studentId:Number(
            window.resultStudentId
        ),

        examName:examName,

        examDate:examDate,

        subjects:
            JSON.parse(
                JSON.stringify(resultSubjects)
            ),

        totalMarks:total,

        obtainedMarks:obtained,

        percentage:percentage,

        result:pass?"PASS":"FAIL"
    };

    if(window.resultEditingId){

        let index=data.findIndex(
            x=>Number(x.id)===
                Number(window.resultEditingId)
        );

        if(index>=0){
            data[index]=record;
        }

    }else{

        data.push(record);

    }

    saveExams(data);

    closeResultEditor();

    alert("Result saved successfully! ✅");

    openResultStudents(
        window.resultClassNo,
        window.resultSection,
        window.resultStream
    );
}


/* CLOSE */

function closeResultEditor(){

    let modal=document.getElementById(
        "resultEditor"
    );

    if(modal)modal.remove();

    resultSubjects=[];
}


/* STUDENT FULL RESULT HISTORY */

function openStudentResultHistory(
    studentId,
    classNo,
    section,
    stream=""
){

    let s=getStudents().find(
        x=>Number(x.id)===Number(studentId)
    );

    if(!s)return;

    let results=getStudentResults(studentId);

    let html=`
    <button class="back-btn"
        onclick="openResultStudents(
            ${classNo},
            '${section}',
            '${stream}'
        )">
        ← Back
    </button>

    <div class="card">

        <div class="card-header">

            <div>
                <h3>
                    📝 ${escapeHtml(s.name)}
                </h3>

                <p style="
                    color:#777;
                    font-size:12px;
                    margin-top:4px
                ">
                    Complete Result History
                </p>
            </div>

            <button
                class="small-btn"
                onclick="openAddResult(
                    ${studentId},
                    ${classNo},
                    '${section}',
                    '${stream}'
                )">
                + Add Result
            </button>

        </div>
    `;

    if(results.length===0){

        html+=`
        <div class="empty">
            <h3>No Result Found</h3>
        </div>
        `;

    }else{

        results.forEach(r=>{

            let subjects=
                Array.isArray(r.subjects)
                ?r.subjects
                :[];

            let total=
                Number(r.totalMarks)||0;

            let obtained=
                Number(r.obtainedMarks)||0;

            let percentage=
                Number(r.percentage)||0;

            html+=`

            <div style="
                border-bottom:1px solid #edf0f4;
                padding:20px;
            ">

                <div style="
                    display:flex;
                    justify-content:space-between;
                    gap:10px;
                    flex-wrap:wrap;
                    margin-bottom:15px;
                ">

                    <div>

                        <h3>
                            ${escapeHtml(r.examName)}
                        </h3>

                        <span style="
                            color:#777;
                            font-size:12px;
                        ">
                            ${formatDate(r.examDate)}
                        </span>

                    </div>

                    <div class="action-buttons">

                        <button
                            class="edit-btn"
                            onclick="editResult(
                                ${r.id},
                                ${studentId},
                                ${classNo},
                                '${section}',
                                '${stream}'
                            )">
                            ✏️ Edit
                        </button>

                        <button
                            class="delete-btn"
                            onclick="deleteResult(
                                ${r.id},
                                ${studentId},
                                ${classNo},
                                '${section}',
                                '${stream}'
                            )">
                            🗑️ Delete
                        </button>

                    </div>

                </div>

                <div class="result-box">

                    <div>
                        Total:
                        <strong>${total}</strong>
                    </div>

                    <div>
                        Obtained:
                        <strong>${obtained}</strong>
                    </div>

                    <div>
                        Percentage:
                        <strong>
                            ${percentage.toFixed(2)}%
                        </strong>
                    </div>

                    <div>
                        <span class="badge ${
                            r.result==="PASS"
                            ?"green"
                            :"red"
                        }">
                            ${r.result||"FAIL"}
                        </span>
                    </div>

                </div>

                <div class="table-container"
                     style="margin-top:15px">

                    <table>

                        <thead>

                            <tr>
                                <th>Subject</th>
                                <th>Maximum Marks</th>
                                <th>Obtained Marks</th>
                                <th>%</th>
                            </tr>

                        </thead>

                        <tbody>
            `;

            subjects.forEach(sub=>{

                let max=Number(sub.max)||0;
                let obt=Number(sub.obtained)||0;

                let pct=max
                    ?obt/max*100
                    :0;

                html+=`
                <tr>

                    <td>
                        <strong>
                            ${escapeHtml(sub.name)}
                        </strong>
                    </td>

                    <td>${max}</td>

                    <td>${obt}</td>

                    <td>
                        ${pct.toFixed(1)}%
                    </td>

                </tr>
                `;
            });

            html+=`
                        </tbody>
                    </table>

                </div>

            </div>
            `;
        });
    }

    html+=`
    </div>
    `;

    document.getElementById("otherPage").innerHTML=html;
}


/* DELETE RESULT */

function deleteResult(
    resultId,
    studentId,
    classNo,
    section,
    stream=""
){

    if(!confirm(
        "Delete this complete result?"
    ))return;

    saveExams(
        getExams().filter(
            x=>Number(x.id)!==
                Number(resultId)
        )
    );

    openStudentResultHistory(
        studentId,
        classNo,
        section,
        stream
    );
}

   को use करें:

function openUpdatedModule(type){

    if(type==="attendance"){
        openAttendanceClasses();
        return;
    }

    if(type==="exams"){
        openResultClasses();
        return;
    }
}


/* =========================================================
   DASHBOARD ATTENDANCE
   ========================================================= */

function getTodayAttendanceForStudents(students){

    let records=getAttendance();

    let ids=students.map(
        s=>Number(s.id)
    );

    let todayRecords=records.filter(
        x=>
        x.date===today() &&
        ids.includes(Number(x.studentId))
    );

    return {

        present:todayRecords.filter(
            x=>x.status==="Present"
        ).length,

        absent:todayRecords.filter(
            x=>x.status==="Absent"
        ).length,

        leave:todayRecords.filter(
            x=>x.status==="Leave"
        ).length
    };
}


/* =========================================================
   COMPATIBILITY
   पुराने code से call होने पर भी काम करेगा
   ========================================================= */

function getAttendanceForStudent(studentId){

    return getAttendance().filter(
        x=>Number(x.studentId)===Number(studentId)
    );
}

function getExamForStudent(studentId){

    let results=getStudentResults(studentId);

    return results.length
        ?results[0]
        :null;
}

function getExamTotal(e){

    if(e.subjects){

        return e.subjects.reduce(
            (a,s)=>a+Number(s.max||0),
            0
        );
    }

    return Number(e.maths||0)+
           Number(e.science||0)+
           Number(e.english||0)+
           Number(e.hindi||0)+
           Number(e.social||0);
}

function getExamPercentage(e){

    if(e.percentage!==undefined){
        return Number(e.percentage);
    }

    let total=getExamTotal(e);

    let obtained=
        Number(e.maths||0)+
        Number(e.science||0)+
        Number(e.english||0)+
        Number(e.hindi||0)+
        Number(e.social||0);

    return total
        ?obtained/total*100
        :0;
}
