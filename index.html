<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SchoolHub</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#222}
.sidebar{position:fixed;left:0;top:0;width:240px;height:100vh;background:#172033;color:white;padding:20px;overflow:auto}
.logo{font-size:24px;font-weight:bold;margin-bottom:25px}
.nav-btn{display:block;width:100%;padding:13px;margin:5px 0;border:0;border-radius:8px;background:transparent;color:white;text-align:left;cursor:pointer;font-size:15px}
.nav-btn:hover,.nav-btn.active{background:#2d3b59}
.main{margin-left:240px;padding:25px}
.card{background:white;border-radius:14px;margin-bottom:20px;box-shadow:0 3px 15px #0000000d;overflow:hidden}
.card-header{padding:18px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee}
.card-header h3{margin:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}
.stat-card{background:white;padding:20px;border-radius:14px}
.stat-number{font-size:28px;font-weight:bold}
.stat-label{color:#777;margin-top:5px}
.small-btn,.btn{border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:bold}
.small-btn{background:#2563eb;color:white}
.btn-primary{background:#2563eb;color:white}
.edit-btn{background:#f59e0b;color:white;border:0;padding:7px 10px;border-radius:6px;cursor:pointer}
.delete-btn{background:#dc2626;color:white;border:0;padding:7px 10px;border-radius:6px;cursor:pointer}
.back-btn{border:0;background:#172033;color:white;padding:10px 15px;border-radius:8px;margin-bottom:15px;cursor:pointer}
.table-container{overflow:auto;padding:15px}
table{width:100%;border-collapse:collapse}
th,td{padding:11px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}
th{background:#f7f9fc}
input,select,textarea{width:100%;padding:10px;border:1px solid #d8dee8;border-radius:8px;background:white}
.form-group{margin-bottom:14px}
.form-group label{display:block;margin-bottom:6px;font-weight:bold}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.modal-bg{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:1000}
.modal{background:white;border-radius:14px;width:min(700px,100%);max-height:90vh;overflow:auto;padding:20px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.close-btn{border:0;background:#eee;font-size:24px;border-radius:7px;cursor:pointer}
.profile-card{display:flex;gap:25px;padding:25px}
.big-student-photo{width:150px;height:150px;border-radius:15px;object-fit:cover;background:#eee}
.profile-photo{width:100%;height:100%;object-fit:cover;border-radius:12px}
.photo-placeholder{width:110px;height:110px;border-radius:12px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:45px}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.info-item{background:#f7f9fc;padding:12px;border-radius:9px}
.info-item small{display:block;color:#777;margin-bottom:4px}
.badge{padding:5px 9px;border-radius:20px;font-size:12px;font-weight:bold}
.green{background:#dcfce7;color:#166534}
.red{background:#fee2e2;color:#991b1b}
.yellow{background:#fef3c7;color:#92400e}
.search-box{max-width:350px;margin-bottom:15px}
.empty{padding:25px;text-align:center;color:#777}
.subject-row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin-bottom:8px}
.homework-item,.notice-item,.period-item{padding:15px;border:1px solid #e4e8ef;border-radius:10px;margin:10px 15px}
.homework-item h4{margin:0 0 8px}
.homework-filter{padding:15px;display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px}
.notice-item{display:flex;justify-content:space-between;gap:15px}
.notice-content strong{display:block;font-size:16px}
.notice-content span{display:block;color:#777;margin-top:5px}
@media(max-width:800px){
.sidebar{width:0;padding:0;overflow:hidden}
.sidebar.open{width:240px;padding:20px;z-index:999}
.main{margin-left:0;padding:15px}
.stats{grid-template-columns:repeat(2,1fr)}
.info-grid{grid-template-columns:1fr 1fr}
.form-grid,.homework-filter{grid-template-columns:1fr}
.profile-card{flex-direction:column}
}
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
<div class="logo">🏫 SchoolHub</div>
<button class="nav-btn active" onclick="showPage('dashboard')">🏠 Dashboard</button>
<button class="nav-btn" onclick="showPage('students')">👨‍🎓 Students</button>
<button class="nav-btn" onclick="showPage('teachers')">👨‍🏫 Teachers</button>
<button class="nav-btn" onclick="showPage('homework')">📚 Homework</button>
<button class="nav-btn" onclick="showPage('timetable')">🕐 Timetable</button>
<button class="nav-btn" onclick="showPage('notices')">📢 Notices</button>
<button class="nav-btn" onclick="showPage('reports')">📊 Reports</button>
<button class="nav-btn" onclick="showPage('settings')">⚙️ Settings</button>
</div>

<div class="main">
<button class="small-btn" onclick="toggleSidebar()" style="margin-bottom:15px">☰ Menu</button>
<div id="displaySchool" style="font-size:25px;font-weight:bold;margin-bottom:20px">ABC Public School</div>
<div id="otherPage"></div>
</div>

<!-- STUDENT MODAL -->
<div class="modal-bg" id="studentModal">
<div class="modal">
<div class="modal-header"><h2 id="studentModalTitle">Add Student</h2><button class="close-btn" onclick="closeStudentModal()">×</button></div>
<div class="form-grid">
<div class="form-group"><label>Student Name *</label><input id="studentName"></div>
<div class="form-group"><label>Father Name *</label><input id="fatherName"></div>
<div class="form-group"><label>Mother Name</label><input id="motherName"></div>
<div class="form-group"><label>Mobile *</label><input id="studentMobile"></div>
<div class="form-group"><label>Gender *</label><select id="studentGender"><option value="">Select</option><option>Male</option><option>Female</option></select></div>
<div class="form-group"><label>Class *</label><select id="studentClass"></select></div>
<div class="form-group"><label>Stream</label><select id="studentStream"><option value="">No Stream</option><option>Science</option><option>Commerce</option><option>Arts</option></select></div>
<div class="form-group" id="studentSectionGroup"><label>Section</label><select id="studentSection"></select></div>
<div class="form-group"><label>DOB</label><input id="studentDOB" type="date" onchange="calculateStudentAge()"></div>
<div class="form-group"><label>Age</label><input id="studentAge"></div>
<div class="form-group"><label>Caste</label><input id="studentCaste"></div>
<div class="form-group"><label>Religion</label><input id="studentReligion"></div>
<div class="form-group"><label>Total Fee</label><input id="studentFee" type="number"></div>
<div class="form-group"><label>Photo</label><input id="studentPhoto" type="file" accept="image/*" onchange="previewStudentPhoto(event)"></div>
</div>
<div id="studentPhotoPreview" class="photo-placeholder">👨‍🎓</div>
<br>
<button class="btn btn-primary" onclick="saveStudent()">Save Student</button>
</div>
</div>

<!-- FEE MODAL -->
<div class="modal-bg" id="feeModal">
<div class="modal">
<div class="modal-header"><h2>Fee Payment</h2><button class="close-btn" onclick="closeFeeModal()">×</button></div>
<div class="form-group"><label>Student</label><input id="feeStudentName" readonly></div>
<div class="form-grid">
<div class="form-group"><label>Amount</label><input id="feeAmount" type="number"></div>
<div class="form-group"><label>Date</label><input id="feeDate" type="date"></div>
<div class="form-group"><label>Mode</label><select id="feeMode"><option>Cash</option><option>UPI</option><option>Bank</option><option>Cheque</option></select></div>
<div class="form-group"><label>Receipt</label><input id="feeReceipt"></div>
</div>
<button class="btn btn-primary" onclick="saveFeePayment()">Save Payment</button>
</div>
</div>

<!-- ATTENDANCE MODAL -->
<div class="modal-bg" id="attendanceModal">
<div class="modal">
<div class="modal-header"><h2 id="attendanceModalTitle">Attendance</h2><button class="close-btn" onclick="closeAttendanceModal()">×</button></div>
<div class="form-group"><label>Date</label><input id="attendanceDate" type="date"></div>
<div id="attendanceStudentList"></div>
<button class="btn btn-primary" onclick="saveAttendanceData()">Save Attendance</button>
</div>
</div>

<!-- EXAM MODAL -->
<div class="modal-bg" id="examModal">
<div class="modal">
<div class="modal-header"><h2 id="examModalTitle">Add Exam Result</h2><button class="close-btn" onclick="closeExamModal()">×</button></div>
<div class="form-group"><label>Student</label><input id="examStudentName" readonly></div>
<div class="form-grid">
<div class="form-group"><label>Exam Name</label><input id="examName"></div>
<div class="form-group"><label>Exam Date</label><input id="examDate" type="date"></div>
</div>
<h3>Subjects</h3>
<div class="subject-row"><b>Subject</b><b>Max Marks</b><b>Obtained</b><b></b></div>
<div id="subjectRows"></div>
<button class="small-btn" onclick="addSubjectRow()">+ Subject</button>
<div id="examSummary" style="padding:15px 0"></div>
<button class="btn btn-primary" onclick="saveExam()">Save Result</button>
</div>
</div>

<!-- TEACHER MODAL -->
<div class="modal-bg" id="teacherModal">
<div class="modal">
<div class="modal-header"><h2 id="teacherModalTitle">Add Teacher</h2><button class="close-btn" onclick="closeTeacherModal()">×</button></div>
<div class="form-grid">
<div class="form-group"><label>Name *</label><input id="teacherName"></div>
<div class="form-group"><label>Employee ID *</label><input id="teacherEmployeeId"></div>
<div class="form-group"><label>Mobile *</label><input id="teacherMobile"></div>
<div class="form-group"><label>Email</label><input id="teacherEmail"></div>
<div class="form-group"><label>Subject *</label><input id="teacherSubject"></div>
<div class="form-group"><label>Class *</label><select id="teacherClass"></select></div>
<div class="form-group"><label>Section</label><input id="teacherSection"></div>
<div class="form-group"><label>Stream</label><select id="teacherStream"><option value="">All</option><option>Science</option><option>Commerce</option><option>Arts</option></select></div>
<div class="form-group"><label>Photo</label><input id="teacherPhoto" type="file" accept="image/*" onchange="previewTeacherPhoto(event)"></div>
</div>
<div id="teacherPhotoPreview" class="photo-placeholder">👨‍🏫</div>
<br>
<button class="btn btn-primary" onclick="saveTeacher()">Save Teacher</button>
</div>
</div>

<!-- COMMON MODAL -->
<div class="modal-bg" id="commonModal">
<div class="modal">
<div class="modal-header"><h2 id="commonTitle"></h2><button class="close-btn onclick="closeCommonModal()">×</button></div>
<div id="commonBody"></div>
</div>
</div>

<script>
const KEY={
students:"school_students",
fees:"school_fees",
attendance:"school_attendance",
exams:"school_exams",
teachers:"school_teachers",
homework:"school_homework",
timetable:"school_timetable",
notices:"school_notices"
};

function get(k){try{return JSON.parse(localStorage.getItem(k)||"[]")}catch(e){return[]}}
function put(k,v){localStorage.setItem(k,JSON.stringify(v))}
function getStudents(){return get(KEY.students)}
function saveStudents(x){put(KEY.students,x)}
function getFees(){return get(KEY.fees)}
function saveFees(x){put(KEY.fees,x)}
function getAttendance(){return get(KEY.attendance)}
function saveAttendance(x){put(KEY.attendance,x)}
function getExams(){return get(KEY.exams)}
function saveExams(x){put(KEY.exams,x)}
function getTeachers(){return get(KEY.teachers)}
function saveTeachers(x){put(KEY.teachers,x)}
function getHomework(){return get(KEY.homework)}
function saveHomework(x){put(KEY.homework,x)}
function getTimetable(){return get(KEY.timetable)}
function saveTimetable(x){put(KEY.timetable,x)}
function getNotices(){return get(KEY.notices)}
function saveNotices(x){put(KEY.notices,x)}

function escapeHtml(x){
return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))
}
function today(){return new Date().toISOString().slice(0,10)}
function formatDate(x){if(!x)return"-";let d=new Date(x+"T00:00:00");return isNaN(d)?x:d.toLocaleDateString("en-IN")}
function classes(){
return Array.from({length:12},(_,i)=>i+1)
}
function fillClassSelect(id,blank=true){
let e=document.getElementById(id);if(!e)return;
e.innerHTML=(blank?'<option value="">Select Class</option>':"")+classes().map(c=>`<option value="${c}">Class ${c}</option>`).join("")
}
function getSections(){
let set=[];
getStudents().forEach(s=>{if(s.section&&!set.some(x=>x.classNo==s.classNo&&x.name==s.section))set.push({classNo:s.classNo,name:s.section})});
return set
}

/* PAGE */
function showPage(page){
document.querySelectorAll(".nav-btn").forEach(x=>x.classList.remove("active"));
document.querySelectorAll(".nav-btn").forEach(x=>{
if(x.innerText.toLowerCase().includes(page==="dashboard"?"dashboard":page))x.classList.add("active")
});
if(page==="dashboard")renderDashboard();
else if(page==="students")renderStudentsHome();
else if(page==="teachers")renderTeachers();
else if(page==="homework")renderHomeworkPage();
else if(page==="timetable")renderTimetable();
else if(page==="notices")renderNotices();
else if(page==="reports")renderReports();
else if(page==="settings")renderSettings();
document.getElementById("sidebar").classList.remove("open")
}

/* DASHBOARD */
function renderDashboard(){
let s=getStudents(),t=getTeachers(),a=getAttendance().filter(x=>x.date===today());
let p=a.filter(x=>x.status==="Present").length;
let total=a.length;
let paid=s.reduce((n,x)=>n+getStudentPaid(x.id),0);
document.getElementById("otherPage").innerHTML=`
<div class="stats">
<div class="stat-card"><div class="stat-number">${s.length}</div><div class="stat-label">Students</div></div>
<div class="stat-card"><div class="stat-number">${t.length}</div><div class="stat-label">Teachers</div></div>
<div class="stat-card"><div class="stat-number">${total?p/total*100|0:0}%</div><div class="stat-label">Today's Attendance</div></div>
<div class="stat-card"><div class="stat-number">₹${paid.toLocaleString("en-IN")}</div><div class="stat-label">Fee Collected</div></div>
</div>
<div class="card"><div class="card-header"><h3>Quick Actions</h3></div>
<div style="padding:20px;display:flex;gap:10px;flex-wrap:wrap">
<button class="small-btn" onclick="openAddStudent(1,'','')">+ Student</button>
<button class="small-btn" onclick="openTeacherModal()">+ Teacher</button>
<button class="small-btn" onclick="openHomeworkModal()">+ Homework</button>
<button class="small-btn" onclick="openTimetableModal()">+ Timetable</button>
<button class="small-btn" onclick="openNoticeModal()">+ Notice</button>
</div></div>`
}

/* STUDENTS */
function renderStudentsHome(){
document.getElementById("otherPage").innerHTML=`
<div class="card"><div class="card-header"><h3>Students</h3><button class="small-btn" onclick="openAddStudent(1,'','')">+ Add Student</button></div>
<div style="padding:20px">
<div class="form-grid">
<div class="form-group"><label>Class</label><select id="studentHomeClass" onchange="loadStudentClasses()"><option value="">Select Class</option>${classes().map(c=>`<option value="${c}">Class ${c}</option>`).join("")}</select></div>
<div class="form-group"><label>Stream</label><select id="studentHomeStream" onchange="loadStudentClasses()"><option value="">All Streams</option><option>Science</option><option>Commerce</option><option>Arts</option></select></div>
</div>
</div>
<div id="studentTableArea"><div class="empty">Select class to view students.</div></div></div>`
}
function loadStudentClasses(){
let c=Number(document.getElementById("studentHomeClass").value),stream=document.getElementById("studentHomeStream").value;
if(!c){document.getElementById("studentTableArea").innerHTML='<div class="empty">Select class.</div>';return}
document.getElementById("studentTableArea").innerHTML=buildStudentTable("students",c,stream,"",getStudents().filter(s=>Number(s.classNo)===c&&(!stream||s.stream===stream)))
}
function buildStudentTable(type,classNo,stream,section,students){
let html=`<div class="table-container"><table><thead><tr><th>Photo</th><th>Name</th><th>Father</th><th>Mobile</th><th>Class</th><th>Section</th><th>Fee</th><th>Action</th></tr></thead><tbody>`;
students.forEach(s=>{
html+=`<tr>
<td>${s.photo?`<img src="${s.photo}" style="width:45px;height:45px;object-fit:cover;border-radius:8px">`:"👨‍🎓"}</td>
<td><strong>${escapeHtml(s.name)}</strong></td><td>${escapeHtml(s.father)}</td><td>${escapeHtml(s.mobile)}</td>
<td>${s.classNo}${s.stream?" • "+escapeHtml(s.stream):""}</td><td>${escapeHtml(s.section||"All")}</td>
<td>₹${Number(s.fee||0).toLocaleString("en-IN")}</td>
<td><button class="small-btn" onclick="openStudentProfile(${s.id})">View</button>
<button class="edit-btn" onclick="editStudent(${s.id},${s.classNo},'${s.stream||""}','${s.section||""}')">✏️</button>
<button class="delete-btn" onclick="deleteStudent(${s.id},${s.classNo},'${s.stream||""}','${s.section||""}')">🗑️</button></td>
</tr>`
});
return html+(students.length?"":"<tr><td colspan='8' class='empty'>No students found.</td></tr>")+"</tbody></table></div>"
}

/* PROFILE */
function openStudentProfile(id){
let s=getStudents().find(x=>Number(x.id)===Number(id));if(!s)return;
let attendance=getAttendanceForStudent(id),p=attendance.filter(x=>x.status==="Present").length;
let exam=getExamForStudent(id),paid=getStudentPaid(id);
document.getElementById("otherPage").innerHTML=`
<button class="back-btn" onclick="renderStudentsHome()">← Back</button>
<div class="card"><div class="card-header"><h3>Student Profile</h3>
<button class="edit-btn" onclick="editStudent(${s.id},${s.classNo},'${s.stream||""}','${s.section||""}')">✏️ Edit</button></div>
<div class="profile-card">
<div>${s.photo?`<img class="big-student-photo" src="${s.photo}">`:`<div class="big-student-photo" style="display:flex;align-items:center;justify-content:center;font-size:50px">👨‍🎓</div>`}</div>
<div style="flex:1"><h2>${escapeHtml(s.name)}</h2><p>Class ${s.classNo} ${s.stream?"• "+escapeHtml(s.stream):""} ${s.section?"• Section "+escapeHtml(s.section):""}</p>
<div class="info-grid">
<div class="info-item"><small>Father</small><strong>${escapeHtml(s.father)}</strong></div>
<div class="info-item"><small>Mother</small><strong>${escapeHtml(s.mother||"-")}</strong></div>
<div class="info-item"><small>Mobile</small><strong>${escapeHtml(s.mobile)}</strong></div>
<div class="info-item"><small>DOB</small><strong>${formatDate(s.dob)}</strong></div>
<div class="info-item"><small>Age</small><strong>${escapeHtml(s.age||"-")}</strong></div>
<div class="info-item"><small>Gender</small><strong>${escapeHtml(s.gender)}</strong></div>
<div class="info-item"><small>Caste</small><strong>${escapeHtml(s.caste||"-")}</strong></div>
<div class="info-item"><small>Religion</small><strong>${escapeHtml(s.religion||"-")}</strong></div>
<div class="info-item"><small>Total Fee</small><strong>₹${Number(s.fee||0).toLocaleString("en-IN")}</strong></div>
<div class="info-item"><small>Paid Fee</small><strong>₹${paid.toLocaleString("en-IN")}</strong></div>
<div class="info-item"><small>Attendance</small><strong>${attendance.length?(p/attendance.length*100).toFixed(1):0}%</strong></div>
<div class="info-item"><small>Latest Result</small><strong>${exam?getExamPercentage(exam).toFixed(1)+"%":"Not Added"}</strong></div>
</div></div></div></div>`
}

/* STUDENT MODAL */
let editingStudentId=null,studentPhotoData="";
function updateSectionOptions(selected=""){
let c=Number(document.getElementById("studentClass").value);
let sections=getSections().filter(x=>Number(x.classNo)===c);
let g=document.getElementById("studentSectionGroup"),sel=document.getElementById("studentSection");
if(!sections.length){g.style.display="none";sel.innerHTML='<option value="">No Section</option>';return}
g.style.display="block";
sel.innerHTML='<option value="">Select Section</option>'+sections.map(x=>`<option>${escapeHtml(x.name)}</option>`).join("");
sel.value=selected
}
function openAddStudent(classNo=1,stream="",section=""){
editingStudentId=null;studentPhotoData="";
document.getElementById("studentModalTitle").innerText="Add Student";
["studentName","fatherName","motherName","studentMobile","studentDOB","studentAge","studentCaste","studentReligion"].forEach(x=>document.getElementById(x).value="");
document.getElementById("studentGender").value="";
document.getElementById("studentClass").value=classNo;
document.getElementById("studentStream").value=stream||"";
document.getElementById("studentFee").value=35000;
document.getElementById("studentPhoto").value="";
document.getElementById("studentPhotoPreview").innerHTML="👨‍🎓";
document.getElementById("studentPhotoPreview").className="photo-placeholder";
updateSectionOptions(section);
document.getElementById("studentModal").style.display="flex"
}
function previewStudentPhoto(e){
let f=e.target.files[0];if(!f)return;
let r=new FileReader();r.onload=x=>{
studentPhotoData=x.target.result;
document.getElementById("studentPhotoPreview").innerHTML=`<img class="profile-photo" src="${studentPhotoData}">`;
document.getElementById("studentPhotoPreview").className=""
};r.readAsDataURL(f)
}
function calculateAgeFromDOB(dob){
if(!dob)return"";
let b=new Date(dob),n=new Date(),a=n.getFullYear()-b.getFullYear(),m=n.getMonth()-b.getMonth();
if(m<0||(m===0&&n.getDate()<b.getDate()))a--;return a>=0?a:""
}
function calculateStudentAge(){document.getElementById("studentAge").value=calculateAgeFromDOB(document.getElementById("studentDOB").value)}
function saveStudent(){
let name=document.getElementById("studentName").value.trim(),father=document.getElementById("fatherName").value.trim(),mother=document.getElementById("motherName").value.trim(),mobile=document.getElementById("studentMobile").value.trim(),gender=document.getElementById("studentGender").value,classNo=Number(document.getElementById("studentClass").value),section=document.getElementById("studentSection").value,stream=document.getElementById("studentStream").value,dob=document.getElementById("studentDOB").value,age=document.getElementById("studentAge").value||calculateAgeFromDOB(dob),caste=document.getElementById("studentCaste").value.trim(),religion=document.getElementById("studentReligion").value.trim(),fee=Number(document.getElementById("studentFee").value)||0;
if(!name||!father||!mobile||!gender||!classNo){alert("Please fill required fields");return}
if((classNo===11||classNo===12)&&!stream){alert("Select Stream");return}
let d=getStudents();
if(editingStudentId){
let s=d.find(x=>Number(x.id)===Number(editingStudentId));
if(s){Object.assign(s,{name,father,mother,mobile,gender,classNo,section,stream,dob,age,caste,religion,fee});if(studentPhotoData)s.photo=studentPhotoData}
}else d.push({id:Date.now(),name,father,mother,mobile,gender,classNo,section,stream,dob,age,caste,religion,fee,photo:studentPhotoData});
saveStudents(d);closeStudentModal();renderStudentsHome();loadStudentClasses()
}

let examSubjects=[];
function getExamForStudent(id){let x=getExams().filter(e=>Number(e.studentId)===Number(id));return x.length?x[x.length-1]:null}

function getExamObtained(e){return(e.subjects||[]).reduce((a,x)=>a+Number(x.obtained||0),0)}
function getExamPercentage(e){let t=getExamTotal(e);return t?getExamObtained(e)/t*100:0}

<div class="subject-row">
<input value="${escapeHtml(x.name)}" placeholder="Subject Name" oninput="examSubjects[${i}].name=this.value;updateExamSummary()">
<input type="number" min="1" value="${x.max}" oninput="examSubjects[${i}].max=Number(this.value)||0;updateExamSummary()">
<input type="number" min="0" value="${x.obtained}" oninput="examSubjects[${i}].obtained=Number(this.value)||0;updateExamSummary()">
<button class="delete-btn" onclick="removeSubjectRow(${i})">×</button></div>`).join("");

}
function updateExamSummary(){
let t=examSubjects.reduce((a,x)=>a+Number(x.max||0),0),o=examSubjects.reduce((a,x)=>a+Number(x.obtained||0),0);
document.getElementById("examSummary").innerHTML=`<strong>Total:</strong> ${t} | <strong>Obtained:</strong> ${o} | <strong>Percentage:</strong> ${t?(o/t*100).toFixed(1):0}%`
}

}

${d.length?d.map(n=>`<div class="notice-item"><div class="notice-content"><strong>📢 ${escapeHtml(n.title)}</strong><span>${formatDate(n.date)}</span><p>${escapeHtml(n.text)}</p></div><div><button class="edit-btn" onclick="openNoticeModal(${n.id})">✏️ Edit</button><button class="delete-btn" onclick="deleteNotice(${n.id})">🗑️ Delete</button></div></div>`).join(""):"<div class='empty'>No notices.</div>"}</div>`
}
function openNoticeModal(id=null){
editingNoticeId=id;
let n=id?getNotices().find(x=>Number(x.id)===Number(id)):null;
document.getElementById("commonTitle").innerText=n?"Edit Notice":"New Notice";
document.getElementById("commonBody").innerHTML=`
<div class="form-group"><label>Title</label><input id="noticeTitle" value="${escapeHtml(n?.title||"")}"></div>
<div class="form-group"><label>Date</label><input id="noticeDate" type="date" value="${n?.date||today()}"></div>
<div class="form-group"><label>Notice Details</label><textarea id="noticeText" style="min-height:150px">${escapeHtml(n?.text||"")}</textarea></div>
<button class="btn btn-primary" onclick="saveNoticeData()">Save Notice</button>`;
document.getElementById("commonModal").style.display="flex"
}
function saveNoticeData(){
let title=document.getElementById("noticeTitle").value.trim(),date=document.getElementById("noticeDate").value,text=document.getElementById("noticeText").value.trim();
if(!title||!date||!text)return alert("Fill notice details");
let d=getNotices(),r={id:editingNoticeId||Date.now(),title,date,text};
let i=d.findIndex(x=>Number(x.id)===Number(r.id));if(i>=0)d[i]=r;else d.push(r);
saveNotices(d);closeCommonModal();renderNotices()
}
function deleteNotice(id){if(confirm("Delete notice?")){saveNotices(getNotices().filter(x=>Number(x.id)!==Number(id)));renderNotices()}}
function closeCommonModal(){document.getElementById("commonModal").style.display="none";editingHomeworkId=null;editingPeriodId=null;editingNoticeId=null}

/* REPORTS */
function renderReports(){
let s=getStudents(),paid=s.reduce((a,x)=>a+getStudentPaid(x.id),0),total=s.reduce((a,x)=>a+Number(x.fee||0),0),r=s.map(x=>getExamForStudent(x.id)).filter(Boolean),pass=r.filter(x=>getExamPercentage(x)>=33).length;
document.getElementById("otherPage").innerHTML=`
<div class="stats">
<div class="stat-card"><div class="stat-number">${s.length}</div><div class="stat-label">Students</div></div>
<div class="stat-card"><div class="stat-number">${total?Math.round(paid/total*100):0}%</div><div class="stat-label">Fee Collection</div></div>
<div class="stat-card"><div class="stat-number">${r.length}</div><div class="stat-label">Results Added</div></div>
<div class="stat-card"><div class="stat-number">${r.length?Math.round(pass/r.length*100):0}%</div><div class="stat-label">Pass Percentage</div></div>
</div>
<div class="card"><div class="card-header"><h3>Reports</h3></div><div style="padding:20px;display:flex;gap:10px;flex-wrap:wrap">
<button class="small-btn" onclick="downloadStudentReport()">⬇️ Student Report</button>
<button class="small-btn" onclick="downloadFeeReport()">⬇️ Fee Report</button>
<button class="small-btn" onclick="downloadAttendanceReport()">⬇️ Attendance Report</button>
<button class="small-btn" onclick="downloadResultReport()">⬇️ Result Report</button>
</div></div>`
}
function csvCell(x){return`"${String(x??"").replace(/"/g,'""')}"`}
function downloadFile(name,content,type){let b=new Blob([content],{type}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function downloadStudentReport(){
let r=[["Student","Father","Mother","Mobile","Class","Section","Stream","Total Fee","Paid","Due"]];
getStudents().forEach(s=>r.push([s.name,s.father,s.mother,s.mobile,s.classNo,s.section,s.stream,s.fee,getStudentPaid(s.id),Math.max(0,Number(s.fee||0)-getStudentPaid(s.id))]));
downloadFile("Student_Report.csv",r.map(x=>x.map(csvCell).join(",")).join("\n"),"text/csv")
}
function downloadFeeReport(){
let r=[["Student","Class","Total Fee","Paid","Due","Date","Amount","Mode","Receipt"]];
getStudents().forEach(s=>getStudentPayments(s.id).forEach(p=>r.push([s.name,s.classNo,s.fee,getStudentPaid(s.id),Math.max(0,Number(s.fee||0)-getStudentPaid(s.id)),p.date,p.amount,p.mode,p.receipt])));
downloadFile("Fee_Report.csv",r.map(x=>x.map(csvCell).join(",")).join("\n"),"text/csv")
}
function downloadAttendanceReport(){
let r=[["Student","Class","Present","Absent","Leave","Attendance %"]];
getStudents().forEach(s=>{let a=getAttendanceForStudent(s.id),p=a.filter(x=>x.status==="Present").length,ab=a.filter(x=>x.status==="Absent").length,l=a.filter(x=>x.status==="Leave").length,total=p+ab+l;r.push([s.name,s.classNo,p,ab,l,total?(p/total*100).toFixed(1):0])});
downloadFile("Attendance_Report.csv",r.map(x=>x.map(csvCell).join(",")).join("\n"),"text/csv")
}
function downloadResultReport(){
let r=[["Student","Class","Section","Stream","Exam","Date","Total","Obtained","Percentage","Result"]];
getStudents().forEach(s=>{let e=getExamForStudent(s.id);r.push([s.name,s.classNo,s.section,s.stream,e?.examName||"",e?.examDate||"",e?getExamTotal(e):"",e?getExamObtained(e):"",e?getExamPercentage(e).toFixed(1):"",e?(getExamPercentage(e)>=33?"PASS":"FAIL"):"Result Not Added"])});
downloadFile("Result_Report.csv",r.map(x=>x.map(csvCell).join("\n")).join("\n"),"text/csv")
}

/* SETTINGS */
function renderSettings(){
document.getElementById("otherPage").innerHTML=`
<div class="card"><div class="card-header"><h3>School Settings</h3></div><div style="padding:20px">
<div class="form-group"><label>School Name</label><input id="settingsSchool" value="${escapeHtml(localStorage.getItem("schoolName")||"ABC Public School")}"></div>
<div class="form-group"><label>Email</label><input id="settingsEmail" value="${escapeHtml(localStorage.getItem("schoolEmail")||"")}"></div>
<button class="btn btn-primary" onclick="saveSettings()">Save Changes</button></div></div>`
}
function saveSettings(){
let s=document.getElementById("settingsSchool").value.trim(),e=document.getElementById("settingsEmail").value.trim();
localStorage.setItem("schoolName",s);localStorage.setItem("schoolEmail",e);document.getElementById("displaySchool").innerText=s;alert("Settings saved!")
}
