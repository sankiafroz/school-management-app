<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SchoolHub - Teacher Profiles</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f4f7fb;color:#172033}
button{cursor:pointer}
.login-page{min-height:100vh;background:linear-gradient(135deg,#1769ff,#6546e8);display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{width:100%;max-width:520px;background:#fff;padding:30px;border-radius:24px;box-shadow:0 20px 60px #0004}
.login-role-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 20px}
.login-role-card{border:1px solid #dce2eb;background:#fff;border-radius:15px;padding:12px 7px;text-align:center;cursor:pointer;transition:.18s;min-height:108px}
.login-role-card:hover{transform:translateY(-2px);box-shadow:0 7px 18px #0001}
.login-role-card.active{border-color:#1769ff;background:#eef4ff;box-shadow:0 0 0 2px #1769ff22}
.login-role-icon{width:54px;height:54px;border-radius:15px;margin:0 auto 7px;display:flex;align-items:center;justify-content:center;background:#eef4ff;color:#1769ff}
.login-role-icon svg{width:34px;height:34px}
.login-role-card strong{display:block;font-size:12px}
.login-role-card small{display:block;color:#667085;font-size:10px;margin-top:3px}
.login-security-note{background:#f8faff;border:1px solid #e5eaf1;border-radius:12px;padding:10px 12px;font-size:12px;color:#667085;margin:12px 0}
.owner-verify-badge{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.owner-verify-badge span{padding:6px 9px;border-radius:20px;background:#fff5d9;color:#9a6700;font-size:11px;font-weight:bold}
.owner-verify-badge span.ok{background:#e6f8ed;color:#15803d}
@media(max-width:700px){.login-role-grid{grid-template-columns:repeat(2,1fr)}}
.logo{width:65px;height:65px;background:#1769ff;color:#fff;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:bold;margin:auto}
.login-title{text-align:center;font-size:28px;font-weight:bold;margin-top:15px}
.login-subtitle{text-align:center;color:#777;margin:7px 0 25px}
.form-group{margin-bottom:15px}
.form-group label{display:block;font-size:14px;font-weight:bold;margin-bottom:7px}
input,select,textarea{width:100%;border:1px solid #dce2eb;border-radius:11px;padding:12px 13px;font-size:15px;outline:none;background:#fff}
input,select{height:47px}
textarea{min-height:100px;resize:vertical}
input[type=file]{padding:10px;height:auto}
.btn{width:100%;height:48px;border:0;border-radius:11px;font-size:16px;font-weight:bold}
.btn-primary{background:#1769ff;color:#fff}
.btn-outline{background:#fff;color:#1769ff;border:1px solid #1769ff;margin-top:10px}
.demo{margin-top:18px;background:#f3f6fb;padding:13px;border-radius:12px;font-size:13px;line-height:1.6}

.app{display:none;min-height:100vh}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:250px;background:#101828;color:#fff;padding:20px 15px;z-index:100;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:bold;margin-bottom:22px}
.brand-icon{width:40px;height:40px;background:#1769ff;border-radius:12px;display:flex;align-items:center;justify-content:center}
.school-box{background:#1c2638;padding:13px;border-radius:13px;margin-bottom:18px;color:#b8c2d0;font-size:13px}
.school-box strong{display:block;color:#fff;font-size:15px;margin-bottom:4px}
.menu{list-style:none}
.menu li{padding:12px;border-radius:10px;margin-bottom:5px;color:#c6cfdb;font-size:14px;cursor:pointer}
.menu li:hover,.menu li.active{background:#1769ff;color:#fff}
.menu .logout{color:#ff9999;margin-top:15px}
.main{margin-left:250px;min-height:100vh}
.topbar{height:72px;background:#fff;border-bottom:1px solid #e7ebf0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:50}
.page-title{font-size:22px;font-weight:bold}
.user{display:flex;align-items:center;gap:10px}
.avatar{width:40px;height:40px;background:#1769ff;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.mobile-menu{display:block;background:none;border:0;font-size:27px;line-height:1;padding:4px 8px;font-weight:bold}
.content{padding:25px}
.welcome{background:linear-gradient(110deg,#1769ff,#6046e8);color:#fff;padding:25px;border-radius:20px;margin-bottom:22px}
.welcome h2{margin-bottom:7px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
.stat-card{background:#fff;border:1px solid #e9edf3;border-radius:17px;padding:20px}
.stat-number{font-size:27px;font-weight:bold;margin-top:12px}
.stat-label{color:#777;font-size:13px;margin-top:4px}
.card{background:#fff;border:1px solid #e9edf3;border-radius:17px;overflow:hidden;margin-bottom:20px}
.card-header{padding:18px 20px;border-bottom:1px solid #edf0f4;display:flex;justify-content:space-between;align-items:center;gap:10px}
.card-header h3{font-size:17px}
.small-btn{border:0;background:#1769ff;color:#fff;padding:9px 13px;border-radius:9px;font-weight:bold}
.edit-btn{background:#eef4ff;color:#1769ff;border:0;padding:7px 10px;border-radius:7px;font-weight:bold}
.delete-btn{background:#feecec;color:#dc2626;border:0;padding:7px 10px;border-radius:7px;font-weight:bold}
.profile-btn{background:#ecfdf3;color:#15803d;border:0;padding:7px 10px;border-radius:7px;font-weight:bold}
.two-column{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.notice{padding:15px 20px;border-bottom:1px solid #edf0f4}
.notice strong{display:block;margin-bottom:5px}
.notice span{color:#777;font-size:12px}
.table-container{overflow-x:auto}
table{width:100%;min-width:850px;border-collapse:collapse}
th,td{padding:14px 18px;text-align:left;border-bottom:1px solid #edf0f4;font-size:14px}
th{background:#fafbfd;color:#667085}
.badge{padding:5px 9px;border-radius:20px;font-size:12px;font-weight:bold}
.green{background:#e6f8ed;color:#15803d}
.red{background:#feecec;color:#dc2626}
.yellow{background:#fff5d9;color:#b77900}
.blue{background:#eef4ff;color:#1769ff}
.back-btn{border:0;background:#eef4ff;color:#1769ff;padding:10px 15px;border-radius:10px;font-weight:bold;margin-bottom:18px}
.class-section{margin-bottom:28px}
.class-heading{font-size:18px;font-weight:bold;margin-bottom:5px}
.class-summary{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:10px;font-size:14px}
.summary-item{font-weight:bold}
.summary-total{color:#1769ff}
.summary-green{color:#15803d}
.summary-red{color:#dc2626}
.summary-yellow{color:#b77900}
.class-card{background:#fff;border:1px solid #e5eaf1;border-radius:17px;padding:20px;cursor:pointer;transition:.2s}
.class-card:hover{transform:translateY(-3px);box-shadow:0 8px 25px #0001}
.class-number{font-size:25px;font-weight:bold;color:#1769ff}
.class-info{color:#777;font-size:13px;margin-top:7px}
.open-text{margin-top:12px;color:#1769ff;font-weight:bold}
.stream-section{margin-bottom:25px}
.stream-heading{font-size:18px;font-weight:bold;margin-bottom:6px}
.stream-summary{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;margin-bottom:10px}
.stream-card{background:#fff;border:1px solid #e5eaf1;border-radius:17px;padding:25px;cursor:pointer;text-align:center;transition:.2s}
.stream-card:hover{box-shadow:0 8px 25px #0001;transform:translateY(-3px)}
.stream-icon{font-size:35px;margin-bottom:10px}
.stream-card h3{font-size:18px}
.stream-card p{color:#777;font-size:13px;margin-top:5px}
.search-box{display:flex;gap:10px;padding:18px;border-bottom:1px solid #edf0f4}
.search-box input{flex:1}
.modal-bg{display:none;position:fixed;inset:0;background:#0008;z-index:300;align-items:center;justify-content:center;padding:20px}
.modal{width:100%;max-width:780px;background:#fff;border-radius:20px;padding:25px;max-height:92vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.close-btn{border:0;width:35px;height:35px;border-radius:50%;font-size:20px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.empty{padding:35px;text-align:center;color:#777}
.action-buttons{display:flex;gap:7px;flex-wrap:wrap}
.student-photo{width:45px;height:45px;border-radius:50%;object-fit:cover;background:#eef4ff;display:block}
.teacher-photo{width:50px;height:50px;border-radius:50%;object-fit:cover;background:#eef4ff}
.profile-photo{width:130px;height:130px;border-radius:18px;object-fit:cover;background:#eef4ff;border:1px solid #dce2eb}
.photo-wrap{text-align:center;margin-bottom:15px}
.photo-placeholder{width:130px;height:130px;border-radius:18px;background:#eef4ff;display:flex;align-items:center;justify-content:center;margin:auto;font-size:45px;color:#1769ff}
.subject-row{display:grid;grid-template-columns:1.3fr .8fr .8fr auto;gap:8px;margin-bottom:8px;align-items:center}
.subject-list{background:#f8faff;padding:14px;border-radius:12px;margin:10px 0 18px}
.section-hidden{display:none!important}
.homework-card{background:#fff;border:1px solid #e5eaf1;border-radius:15px;padding:18px;margin-bottom:12px}
.homework-images{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.homework-images img{width:180px;height:130px;object-fit:cover;border:1px solid #dce2eb;border-radius:10px}
.homework-card h3{margin-bottom:7px}
.homework-meta{display:flex;gap:12px;flex-wrap:wrap;color:#667085;font-size:13px;margin-bottom:10px}
.student-profile-list{padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.student-profile-card{border:1px solid #e5eaf1;border-radius:16px;padding:16px;background:#fff;box-shadow:0 3px 12px #00000008}
.student-profile-top{display:flex;gap:14px;align-items:center;padding-bottom:13px;border-bottom:1px solid #edf0f4;margin-bottom:13px}
.student-profile-avatar{width:78px;height:78px;border-radius:16px;object-fit:cover;background:#eef4ff;display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
.student-profile-avatar img{width:100%;height:100%;object-fit:cover;border-radius:16px}
.student-profile-name{font-size:18px;font-weight:bold}
.student-profile-meta{color:#667085;font-size:12px;margin-top:5px;line-height:1.5}
.student-profile-details{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.student-profile-detail{background:#f8faff;padding:9px;border-radius:9px}
.student-profile-detail small{display:block;color:#777;font-size:11px;margin-bottom:3px}
.student-profile-detail strong{display:block;font-size:13px;word-break:break-word}
.fee-paid{color:#15803d!important}.fee-pending{color:#b77900!important}

.dashboard-class-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;padding:18px}
.dashboard-class-card{background:#fff;border:1px solid #e5eaf1;border-radius:17px;padding:18px;box-shadow:0 3px 12px #00000008}
.dashboard-class-card h3{font-size:19px;margin-bottom:4px}
.dashboard-class-meta{font-size:12px;color:#667085;margin-bottom:14px}
.dashboard-metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.dashboard-metric{border:1px solid #edf0f4;background:#fafbfd;border-radius:11px;padding:11px;text-align:left;cursor:pointer;transition:.15s}
.dashboard-metric:hover{transform:translateY(-2px);box-shadow:0 5px 15px #0001}
.dashboard-metric strong{display:block;font-size:17px;margin-top:4px}
.dashboard-metric small{display:block;color:#667085;font-size:11px}
.dashboard-metric.green strong{color:#15803d}.dashboard-metric.red strong{color:#dc2626}
.dashboard-metric.yellow strong{color:#b77900}.dashboard-metric.blue strong{color:#1769ff}
.dashboard-teacher-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;padding:18px}
.dashboard-teacher-card{background:#fff;border:1px solid #e5eaf1;border-radius:15px;padding:15px;display:flex;gap:12px;align-items:center;cursor:pointer}
.dashboard-teacher-card:hover{box-shadow:0 6px 18px #0001;transform:translateY(-2px)}
.dashboard-teacher-card img,.dashboard-teacher-avatar{width:58px;height:58px;border-radius:14px;object-fit:cover;background:#eef4ff;display:flex;align-items:center;justify-content:center;font-size:25px;flex:none}
.dashboard-teacher-card .tname{font-weight:bold;font-size:16px}.dashboard-teacher-card .tmeta{font-size:12px;color:#667085;margin-top:4px;line-height:1.5}
.dashboard-link-btn{border:0;background:#eef4ff;color:#1769ff;padding:8px 11px;border-radius:9px;font-weight:bold;cursor:pointer}
.dashboard-detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:18px}
.dashboard-detail-item{background:#f8faff;padding:11px;border-radius:10px}
.dashboard-detail-item small{display:block;color:#777;font-size:11px;margin-bottom:4px}
.dashboard-detail-item strong{display:block;font-size:13px;word-break:break-word}
@media(max-width:700px){.dashboard-class-grid,.dashboard-teacher-grid{grid-template-columns:1fr}.dashboard-detail-grid{grid-template-columns:1fr}}

@media(max-width:700px){.student-profile-list{grid-template-columns:1fr}.student-profile-details{grid-template-columns:1fr 1fr}}

.profile-box{padding:22px}
.profile-head{display:flex;gap:20px;align-items:center;padding-bottom:20px;border-bottom:1px solid #edf0f4;margin-bottom:18px}
.profile-large{width:120px;height:120px;border-radius:20px;object-fit:cover;background:#eef4ff}
.profile-details{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.detail-item{background:#f8faff;padding:13px;border-radius:10px}
.detail-item small{display:block;color:#777;margin-bottom:4px}
.detail-item strong{display:block}

.teacher-profile-list{padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.teacher-profile-card{border:1px solid #e5eaf1;border-radius:16px;padding:16px;background:#fff;box-shadow:0 3px 12px #00000008}
.teacher-profile-top{display:flex;gap:14px;align-items:center;padding-bottom:13px;border-bottom:1px solid #edf0f4;margin-bottom:13px}
.teacher-profile-avatar{width:78px;height:78px;border-radius:16px;object-fit:cover;background:#eef4ff;display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
.teacher-profile-avatar img{width:100%;height:100%;object-fit:cover;border-radius:16px}
.teacher-profile-name{font-size:18px;font-weight:bold}
.teacher-profile-meta{color:#667085;font-size:12px;margin-top:5px;line-height:1.5}
.teacher-profile-details{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.teacher-profile-detail{background:#f8faff;padding:9px;border-radius:9px}
.teacher-profile-detail small{display:block;color:#777;font-size:11px;margin-bottom:3px}
.teacher-profile-detail strong{display:block;font-size:13px;word-break:break-word}
.teacher-subjects{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.teacher-subject-box{background:#eef4ff;color:#1769ff;padding:9px;border-radius:9px;font-size:13px;font-weight:bold}
@media(max-width:700px){.teacher-profile-list{grid-template-columns:1fr}}

.teacher-card{display:flex;align-items:center;gap:15px}
@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){
.sidebar{transform:translateX(-100%);transition:.25s}
.sidebar.open{transform:translateX(0)}
.main{margin-left:0}
.mobile-menu{display:block}
.topbar{padding:0 15px}
.content{padding:15px}
.stats{grid-template-columns:1fr 1fr}
.two-column{grid-template-columns:1fr}
.user-name{display:none}
.class-summary,.stream-summary{gap:10px;font-size:13px}
.form-grid{grid-template-columns:1fr}
.search-box{flex-direction:column}
.subject-row{grid-template-columns:1fr 1fr}
.profile-details{grid-template-columns:1fr}
.profile-head{align-items:flex-start;flex-direction:column}
}

.dashboard-school-title{text-align:center;font-size:28px;font-weight:800;margin:0 0 10px;color:#172033}
.dashboard-notice-ticker{background:#fff3cd;border:1px solid #ffe08a;color:#9a6700;border-radius:12px;padding:11px 15px;margin:0 0 18px;display:flex;align-items:center;gap:10px;white-space:nowrap;overflow:hidden;cursor:pointer} .dashboard-notice-ticker:hover{box-shadow:0 4px 15px #0001;transform:translateY(-1px)}
.dashboard-notice-ticker span:last-child{font-weight:bold;overflow:hidden;text-overflow:ellipsis;animation:noticeBlink 1.2s infinite}
.dashboard-notice-label{font-weight:800;flex:none}
@keyframes noticeBlink{0%,45%{opacity:1}55%,100%{opacity:.25}}
@media(max-width:700px){.dashboard-school-title{font-size:22px}.dashboard-notice-ticker{font-size:13px}}
.sidebar.desktop-hidden{transform:translateX(-100%)}
.main.sidebar-hidden{margin-left:0}
@media(max-width:700px){
  .sidebar.desktop-hidden{transform:none}
}

/* Dashboard school branding + slideshow */
.dashboard-branding{text-align:center;margin-bottom:18px}
.dashboard-logo-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.dashboard-school-logo{width:92px;height:92px;border-radius:18px;object-fit:contain;background:#fff;border:1px solid #e5eaf1;padding:5px;box-shadow:0 5px 18px #0001}
.dashboard-logo-upload{display:inline-flex;align-items:center;justify-content:center;background:#eef4ff;color:#1769ff;border:1px solid #d7e5ff;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:bold;cursor:pointer}
.dashboard-logo-upload input{display:none}
.dashboard-slideshow{background:#fff;border:1px solid #e5eaf1;border-radius:18px;padding:10px;margin-top:12px;overflow:hidden;max-width:900px;margin-left:auto;margin-right:auto}
.dashboard-slide-track{width:100%;display:flex;justify-content:center;align-items:center}
.dashboard-slide-img{width:100%;height:300px;object-fit:cover;border-radius:14px;background:#f3f6fb;display:block}
@media(max-width:700px){.dashboard-slide-img{height:210px}}
/* Timetable */
#classTimetableTable .ctt-time{min-width:180px;width:180px}
#classTimetableTable .ctt-period{min-width:85px;width:85px}
#classTimetableTable .ctt-subject{min-width:145px;width:145px}
.gallery-preview-grid img{background:#f8faff}
#classTimetableTable th:nth-child(2),#classTimetableTable td:nth-child(2){min-width:200px}


.teacher-documents-box{background:#f8faff;border:1px solid #dce5f3;border-radius:12px;padding:14px;margin-top:15px}
.teacher-documents-list{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.teacher-document-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid #e5eaf1;border-radius:9px;padding:9px 11px;font-size:13px}
.teacher-document-item a{color:#1769ff;font-weight:bold;text-decoration:none}
.teacher-document-item button{border:0;background:#feecec;color:#dc2626;padding:5px 8px;border-radius:7px;font-weight:bold}
.teacher-login-credentials{background:#ecfdf3;border:1px solid #bbf7d0;color:#166534;border-radius:12px;padding:13px;margin-top:15px}
.teacher-login-credentials strong{color:#14532d}
.teacher-credential-copy{border:0;background:#1769ff;color:#fff;padding:7px 10px;border-radius:8px;font-weight:bold;margin-top:8px}
.teacher-profile-login{margin-top:12px;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:10px;font-size:12px}
.teacher-profile-docs{margin-top:10px;display:flex;gap:7px;flex-wrap:wrap}
.teacher-profile-docs a{background:#eef4ff;color:#1769ff;text-decoration:none;padding:7px 9px;border-radius:8px;font-size:12px;font-weight:bold}
.result-register-table th,.result-register-table td{white-space:nowrap}
.result-register-table th small{font-size:10px;color:#667085}
.result-register-table tbody tr:hover{background:#f8faff}
.result-register-table .result-student-link:hover{text-decoration:underline}

/* STUDENT / PARENT PORTAL */
.student-portal-only{display:none}
.student-portal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:20px}
.student-portal-card{background:#fff;border:1px solid #e5eaf1;border-radius:17px;padding:18px;box-shadow:0 3px 12px #00000008}
.student-portal-card h3{font-size:17px;margin-bottom:10px}
.student-portal-stat{font-size:28px;font-weight:800;color:#1769ff}
.student-portal-muted{font-size:12px;color:#667085;margi
